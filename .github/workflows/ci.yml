name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
        working-directory: relay
      - run: npm run typecheck
        working-directory: relay
      - run: npm test
        working-directory: relay
  core:
    # MergeableCore arrives with plan Tasks 7-10; the job passes until then.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: swift test
        run: |
          if [ -f MergeableCore/Package.swift ]; then
            cd MergeableCore && swift test
          else
            echo "MergeableCore not present yet; skipping."
          fi
  app:
    # XcodeGen project; builds iOS (simulator) and macOS without signing, then runs the unit tests on macOS.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        working-directory: App
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS
        working-directory: App
        run: xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS
        working-directory: App
        run: xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test macOS
        working-directory: App
        run: xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
