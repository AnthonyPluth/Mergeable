name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
        working-directory: relay
      - run: npm run typecheck
        working-directory: relay
      - run: npm test
        working-directory: relay
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Test check-token.sh
        run: bash tools/test/check-token.test.sh
  core:
    # MergeableCore arrives with plan Tasks 7-10; the job passes until then.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: swift test
        run: |
          if [ -f MergeableCore/Package.swift ]; then
            cd MergeableCore && swift test
          else
            echo "MergeableCore not present yet; skipping."
          fi
  app:
    # XcodeGen project; builds iOS (simulator) and macOS without signing, then runs the unit tests on macOS.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        working-directory: App
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS
        working-directory: App
        run: xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS
        working-directory: App
        run: xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test macOS
        working-directory: App
        run: xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      # Mockup sign-off: the real screens rendered from fixture data (App/Tests/MockupScreenshotTests.swift), dark, 2x.
      # They run after the build and test steps, so nothing here can change their result. Compare them with docs/mockups.
      - name: Screenshots (macOS)
        working-directory: App
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test -only-testing:MergeableTests/MockupScreenshotTests
      # Simulator boot and device names vary between runner images, so this one is an aid, not a gate; the macOS step
      # above also renders the iPhone-size frames.
      - name: Screenshots (iOS Simulator)
        continue-on-error: true
        working-directory: App
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted((r for r in runtimes if "iOS" in r), reverse=True):
              phones = [d for d in runtimes[runtime] if d["name"].startswith("iPhone")]
              plain = [d for d in phones if re.fullmatch(r"iPhone \d+", d["name"])]
              pick = (plain or phones)
              if pick:
                  print(pick[-1]["udid"]); break
          ')
          echo "Simulator: $udid"
          test -n "$udid"
          xcodebuild -project Mergeable.xcodeproj -scheme Mergeable -destination "id=$udid" CODE_SIGNING_ALLOWED=NO test -only-testing:MergeableTests/MockupScreenshotTests
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn
