name: Mergeable
options:
  bundleIdPrefix: com.pluth
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  MergeableCore:
    path: ../MergeableCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mergeable:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Shared]
    dependencies:
      - package: MergeableCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mergeable
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.pluth.mergeable.refresh]
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluth.mergeable
        # The push entitlement key differs by platform: aps-environment on iOS, com.apple.developer.aps-environment on macOS.
        CODE_SIGN_ENTITLEMENTS: Entitlements/Mergeable-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Entitlements/Mergeable-macOS.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  MergeableTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Mergeable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluth.mergeable.tests
        GENERATE_INFOPLIST_FILE: YES
        # A multiplatform target's host executable sits in a different place on each platform.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mergeable.app/Mergeable
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Mergeable.app/Contents/MacOS/Mergeable
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Mergeable:
    build:
      targets:
        Mergeable: all
    test:
      targets: [MergeableTests]
